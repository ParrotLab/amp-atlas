name: Feature request
description: Suggest an improvement or new capability for Atlas
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Atlas is opinionated on purpose, so the best requests
        explain the *problem* you're hitting, not just the feature — that helps us
        find the solution that fits the tool.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The situation or friction that prompted this. Focus on the "why".
      placeholder: When I have several Systems open, I lose track of which drafts are unpublished.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Your proposed solution or capability.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered (optional)
      description: Other ways you've worked around this, or other approaches you thought about.
