name: Issue triage

# Auto-classify + label new issues per our label guide, flag likely duplicates, and point
# common problems at the troubleshooting FAQ. Advisory + non-destructive (never closes).
# Uses scoped `gh` commands (not arbitrary Bash) so a malicious issue body can't run anything else.

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Only these scoped gh commands + read tools — safe against prompt injection in issue bodies.
          claude_args: >-
            --allowedTools "Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh issue list:*),Bash(gh issue view:*),Read,Grep,Glob"
          prompt: |
            Triage GitHub issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            The `gh` CLI is available and authenticated (GH_TOKEN is set).

            1. Read `docs/contributing/labels.md`, choose the single best TYPE label
               (bug / enhancement / documentation / question), and apply it:
               `gh issue edit ${{ github.event.issue.number }} --add-label "<label>"`
               Add a status label only if clearly warranted.
            2. Check open issues (`gh issue list --state open`). If this clearly duplicates an
               existing one, add ONE short, friendly comment linking it
               (`gh issue comment ${{ github.event.issue.number }} --body "..."`). Never close anything.
            3. If it's a common problem covered in
               `docs/user-guides/04-reference/02-troubleshooting-faq.md`, add a brief comment
               pointing the author there.

            Be concise and friendly; apply the minimum necessary — no over-labeling.
